<style>
:root{
  --bg:#f4f1ec; --bg-grad:none; --head-ink:#1f1b16; --sub-ink:#6f675d;
  --card:#ffffff; --card-ink:#1f1b16; --muted:#7a7268; --line:#e7e1d8;
  --accent:#2f5d50; --accent-ink:#fff; --chip:#efe9e0; --chip-ink:#4a443c;
  --hfont:'Fraunces', Georgia, serif; --bfont:'DM Sans', system-ui, sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.08);
}
body[data-tema="jul"]{
  --bg:#7a1521; --bg-grad:radial-gradient(1200px 600px at 50% -10%, #a3202f 0%, transparent 70%);
  --head-ink:#fff3df; --sub-ink:#f1cfc0; --card:#fffaf2; --card-ink:#2a1a12; --muted:#86715f;
  --line:#efdfcb; --accent:#1e5a3a; --chip:#f4e7d4; --chip-ink:#6a4a2c;
}
body[data-tema="fodselsdag"]{
  --bg:#fff1dc; --bg-grad:radial-gradient(900px 500px at 85% -5%, #ffd2dc 0%, transparent 60%), radial-gradient(900px 500px at 0% 0%, #d7ecff 0%, transparent 55%);
  --head-ink:#2b1d3d; --sub-ink:#6b5a78; --card:#fff; --card-ink:#2b1d3d; --muted:#7b6d86;
  --line:#f1e3d3; --accent:#e2445c; --chip:#fde6ea; --chip-ink:#a3243a;
}
body[data-tema="bryllup"]{
  --bg:#f7f2ea; --bg-grad:radial-gradient(1000px 500px at 50% -10%, #fffdf8 0%, transparent 70%);
  --head-ink:#3b3226; --sub-ink:#857865; --card:#fffdf9; --card-ink:#3b3226; --muted:#8e826f;
  --line:#ebe2d3; --accent:#a9844a; --chip:#f2eadc; --chip-ink:#7a5f33;
  --hfont:'Cormorant Garamond', Georgia, serif;
}
body[data-tema="fest"]{
  --bg:#12141c; --bg-grad:radial-gradient(1000px 520px at 50% -10%, #2a2440 0%, transparent 70%);
  --head-ink:#f5e6c4; --sub-ink:#b9ad94; --card:#1e2130; --card-ink:#f3ecdc; --muted:#a49a86;
  --line:#2e3245; --accent:#d4a84a; --accent-ink:#1a1408; --chip:#2c3044; --chip-ink:#e6d3a6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--bfont); background:var(--bg); background-image:var(--bg-grad); background-attachment:fixed; color:var(--head-ink); min-height:100vh; -webkit-font-smoothing:antialiased; transition:background-color .3s}
button,input,textarea,select{font:inherit}
a{color:inherit}
.wrap{max-width:1080px; margin:0 auto; padding:calc(22px + env(safe-area-inset-top)) 18px 90px; position:relative; z-index:1}

.fx{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0}
.fx span{position:absolute; top:-8vh; animation:fall linear infinite; color:var(--head-ink)}
.fx.rise span{top:auto; bottom:-10vh; animation-name:rise}
@keyframes fall{to{transform:translate3d(6vw,115vh,0) rotate(200deg)}}
@keyframes rise{to{transform:translate3d(-4vw,-120vh,0) rotate(-12deg)}}
@media (prefers-reduced-motion:reduce){.fx{display:none}}

/* Redigér-bjælke */
.editbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:color-mix(in srgb, var(--card) 92%, transparent); color:var(--card-ink); border-radius:16px; padding:10px 12px 10px 16px; box-shadow:var(--shadow); position:sticky; top:10px; z-index:5; backdrop-filter:blur(8px)}
.editbar .lab{font-weight:700; font-size:14px; flex:1; min-width:150px}
.editbar .lab small{display:block; font-weight:400; color:var(--muted); font-size:12px}

header.hero{text-align:center; padding:26px 0 6px}
.hero .icon{font-size:44px; line-height:1}
.hero h1{font-family:var(--hfont); font-weight:700; font-size:clamp(30px,6vw,52px); line-height:1.05; margin:10px 0 8px; letter-spacing:-.01em}
body[data-tema="bryllup"] .hero h1{font-weight:500}
.hero p{color:var(--sub-ink); margin:0 auto; max-width:520px; font-size:15px; line-height:1.5}
.count{display:inline-block; margin-top:12px; padding:6px 14px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:14px}
.hero .greet{font-family:var(--hfont); font-size:clamp(18px,3.6vw,22px); font-style:italic; color:var(--head-ink); margin:12px auto 0; opacity:.9}
.live{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--sub-ink); margin-top:10px}
.live i{width:8px; height:8px; border-radius:50%; background:#3ec27a; box-shadow:0 0 0 0 rgba(62,194,122,.6); animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(62,194,122,0)}100%{box-shadow:0 0 0 0 rgba(62,194,122,0)}}

.tabs{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:22px 0}
.tab{border:0; cursor:pointer; padding:10px 18px; border-radius:999px; background:color-mix(in srgb, var(--card) 70%, transparent); color:var(--card-ink); font-weight:500; display:flex; gap:8px; align-items:center; box-shadow:var(--shadow)}
.tab .n{font-size:12px; opacity:.6}
.tab.on{background:var(--accent); color:var(--accent-ink)}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px}
.card{background:var(--card); color:var(--card-ink); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; position:relative; transition:transform .15s, opacity .2s}
@keyframes pop{from{opacity:0; transform:translateY(8px) scale(.98)}}
.card{cursor:pointer; transition:transform .18s ease, box-shadow .18s ease, opacity .2s; -webkit-tap-highlight-color:transparent}
.card:hover{transform:translateY(-3px); box-shadow:0 2px 4px rgba(0,0,0,.06), 0 16px 34px rgba(0,0,0,.16)}
.card:active, .card.picked{transform:translateY(-6px) scale(1.03); box-shadow:0 4px 8px rgba(0,0,0,.08), 0 22px 44px rgba(0,0,0,.25); z-index:2}
.card:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.card.fav{outline:3px solid var(--accent); outline-offset:-3px}
.card.hidden{opacity:.45}
.card .img{aspect-ratio:1/1; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; border-bottom:1px solid var(--line)}
.card .img img{width:100%; height:100%; object-fit:contain}
.card .img.ph{font-size:54px; background:var(--chip); cursor:default}
.card .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1}
.card h3{margin:0; font-size:17px; line-height:1.3; font-weight:700}
.card .price{font-weight:700; color:var(--accent)}
.card .note{color:var(--muted); font-size:14px; line-height:1.45; margin:0; white-space:pre-line}
.card .actions{display:flex; gap:8px; margin-top:auto; padding-top:10px; flex-wrap:wrap}
.badge{position:absolute; top:10px; left:10px; background:var(--accent); color:var(--accent-ink); font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px; z-index:1}
.badge.off{background:#555; color:#fff}
.tools{position:absolute; top:8px; right:8px; display:flex; gap:5px; z-index:1}
.tbtn{border:0; width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,.92); color:#2b2620; cursor:pointer; font-size:15px; box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tbtn:disabled{opacity:.35; cursor:default}
.addcard{border:2px dashed color-mix(in srgb, var(--head-ink) 35%, transparent); background:transparent; color:var(--head-ink); border-radius:var(--r); min-height:260px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:16px}
.addcard b{font-size:44px; font-weight:400; line-height:1}
.addcard:hover{background:color-mix(in srgb, var(--card) 20%, transparent)}

.btn{border:0; cursor:pointer; border-radius:12px; padding:10px 14px; font-weight:700; font-size:14px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px}
.btn.pri{background:var(--accent); color:var(--accent-ink)}
.btn.sec{background:var(--chip); color:var(--chip-ink)}
.btn.msg{background:linear-gradient(135deg,#0866ff,#a033ff 70%,#ff5280); color:#fff}
.btn.danger{background:#fbe3e1; color:#a1281e}
.btn:disabled{opacity:.5; cursor:default}
.grow{flex:1}
.empty{text-align:center; padding:50px 20px; color:var(--sub-ink)}
.empty .e{font-size:42px}

/* Del-panel */
.sheet h2{font-family:'Fraunces',serif; margin:0 0 6px; font-size:22px}
.lbl{font-size:13px; font-weight:700; color:#7a7268; margin:14px 0 6px; display:block}
.opts{display:flex; gap:8px; flex-wrap:wrap}
.opt{position:relative}
.opt input{position:absolute; opacity:0; pointer-events:none}
.opt span{display:inline-block; padding:9px 14px; border-radius:999px; background:#efe9e0; color:#4a443c; cursor:pointer; font-weight:500; font-size:14px; border:2px solid transparent}
.opt input:checked + span{background:#2f5d50; color:#fff}
.opt input:focus-visible + span{border-color:#1f1b16}
.hint{font-size:12.5px; color:#857b6d; margin-top:6px; line-height:1.4}
.sharebtns{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px}
.sharebtns .btn{padding:13px}
.sharebtns .wide{grid-column:1/-1}
input[type=text],input[type=url],input[type=date],input[type=password],textarea,select{width:100%; padding:11px 12px; border-radius:12px; border:1px solid #e2dbcf; background:#fff; color:#1f1b16}
textarea{resize:vertical; min-height:64px}
.demo{background:#fff6d6; color:#5c4a12; border-radius:12px; padding:10px 14px; font-size:13.5px; margin-bottom:12px; line-height:1.45}

.modal{position:fixed; inset:0; background:rgba(20,16,12,.55); display:flex; align-items:flex-end; justify-content:center; z-index:50}
.sheet{background:#fff; color:#1f1b16; width:100%; max-width:560px; max-height:94vh; overflow:auto; border-radius:22px 22px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); animation:up .25s ease}
@keyframes up{from{transform:translateY(30px); opacity:.6}}
@media (min-width:640px){ .modal{align-items:center; padding:20px} .sheet{border-radius:22px} }
.sheet .btn.sec{background:#efe9e0; color:#4a443c}
.sheet .btn.pri{background:#2f5d50; color:#fff}
.preview{margin-top:10px; border-radius:14px; background:#f4f1ec; min-height:110px; display:flex; align-items:center; justify-content:center; overflow:hidden}
.preview img{max-width:100%; max-height:240px; display:block}
.preview .ph{color:#8a8277; font-size:14px; padding:26px; text-align:center}
.imgbtns{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
.imgbtns label{cursor:pointer}
.sheet .foot{display:flex; gap:10px; margin-top:20px}
.check{display:flex; gap:10px; align-items:center; margin-top:14px; font-weight:500; cursor:pointer}
.check input{width:20px; height:20px; accent-color:#2f5d50}
.detail{position:fixed; inset:0; background:rgba(20,16,12,.6); z-index:60; display:flex; align-items:center; justify-content:center; padding:16px; animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.dbox{background:#fff; color:#1f1b16; border-radius:22px; width:100%; max-width:520px; max-height:92vh; overflow:auto; box-shadow:0 30px 60px rgba(0,0,0,.35); animation:up .25s ease}
.dimg{background:#fff; display:flex; align-items:center; justify-content:center; max-height:55vh; overflow:hidden; border-bottom:1px solid #eee}
.dimg img{max-width:100%; max-height:55vh; object-fit:contain; display:block}
.dimg.ph{font-size:80px; padding:40px; background:#f4f1ec}
.dtxt{padding:18px 20px calc(20px + env(safe-area-inset-bottom))}
.dtxt h2{font-family:'Fraunces',serif; font-size:24px; margin:4px 0 6px; line-height:1.2}
.dprice{font-weight:700; font-size:20px; color:#2f5d50}
.dtxt p{color:#5f574d; line-height:1.5; white-space:pre-line}
.dfav{display:inline-block; background:#2f5d50; color:#fff; font-weight:700; font-size:13px; padding:4px 10px; border-radius:999px}
.dbtns{display:flex; flex-direction:column; gap:10px; margin-top:16px}
.btn.big{padding:16px; font-size:17px; border-radius:14px}
.dbox .btn.sec{background:#efe9e0; color:#4a443c}
.dbox .btn.pri{background:#2f5d50; color:#fff}
.plist{display:flex; flex-direction:column; gap:8px}
.prow{display:flex; align-items:center; gap:8px}
.prow .opt span{display:block}
.pnum{width:20px; font-weight:700; color:#857b6d}
.prow .tbtn{background:#efe9e0; box-shadow:none; width:40px; height:40px}
.pricebox{position:relative}
.pricebox input{padding-right:44px}
.pricebox span{position:absolute; right:14px; top:50%; transform:translateY(-50%); color:#857b6d; font-weight:700; pointer-events:none}
.zoom{position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:70; padding:20px; cursor:zoom-out}
.zoom img{max-width:100%; max-height:100%; border-radius:10px; background:#fff}
.spin{display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1f1b16; color:#fff; padding:11px 18px; border-radius:12px; font-size:14px; z-index:80; max-width:90vw; box-shadow:var(--shadow)}
@media (max-width:540px){ .grid{grid-template-columns:repeat(2,1fr); gap:12px} .card .body{padding:10px 12px 12px} .card h3{font-size:15px} .card .note{font-size:13px} .tbtn{width:30px;height:30px;font-size:13px} .tools{gap:4px; top:6px; right:6px} .badge{font-size:11px; top:6px; left:6px; padding:4px 8px} body.editing .badge span{display:none} .addcard{min-height:200px} }
.lock{max-width:380px; margin:70px auto; background:var(--card); color:var(--card-ink); border-radius:20px; padding:26px; text-align:center; box-shadow:var(--shadow)}
</style>
</head>
<body>
<div id="fx" class="fx"></div>
<div class="wrap" id="app"></div>

<script type="module">
/* ============================================================
   OPSÆTNING — ret kun her
   ============================================================ */
const CONFIG = {
  // Indsæt din Firebase-config. Så længe apiKey starter med "INDSÆT",
  // kører siden i demo-tilstand (gemmer kun i denne browser).
  firebase: {
    apiKey: "AIzaSyC-7DqN_aD43Ky0LrO-5dcJaLB69pohruA",
    authDomain: "onskeliste-ab2e7.firebaseapp.com",
    projectId: "onskeliste-ab2e7",
    storageBucket: "onskeliste-ab2e7.firebasestorage.app",
    messagingSenderId: "428463648636",
    appId: "1:428463648636:web:2a1a1d68636211cc5cfef9"
  },
  // Valgfri kode til redigér-siden. Skal kun tastes én gang pr. telefon.
  // Lad den stå tom ("") hvis du ikke vil have kode.
  kode: "",
  persons: [
    { id: "mike",   name: "Mike",   gen: "Mikes",   emoji: "🧔" },
    { id: "maria",  name: "Maria",  gen: "Marias",  emoji: "👩" },
    { id: "magnus", name: "Magnus", gen: "Magnus'", emoji: "🧒" }
  ]
};

const THEMES = {
  jul:        { label: "Jul",        icon: "🎄", til: "til jul",            fx: ["❄","❅","❆","✦"], mode: "fall", dato: () => nextDate(12, 24) },
  fodselsdag: { label: "Fødselsdag", icon: "🎂", til: "til fødselsdagen",   fx: ["🎈","🎈","🎉","✨"], mode: "rise" },
  bryllup:    { label: "Bryllup",    icon: "💍", til: "til brylluppet",     fx: ["♡","❀","✿","♡"], mode: "fall" },
  fest:       { label: "Stor fest",  icon: "🥂", til: "til den store fest", fx: ["✦","✧","•","✦"], mode: "fall" }
};
/* ============================================================ */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const person = id => CONFIG.persons.find(p => p.id === id);
const DEMO = !CONFIG.firebase.apiKey || CONFIG.firebase.apiKey.startsWith("INDSÆT");
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const toast = (msg, ms = 2600) => { document.querySelectorAll(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); };
const ls = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
function nextDate(m, d) {
  const now = new Date(); let y = now.getFullYear();
  const t = new Date(y, m - 1, d); if (t < new Date(now.getFullYear(), now.getMonth(), now.getDate())) y++;
  return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

/* ---------- Data ---------- */
function demoStore() {
  const KEY = "onskeliste-demo", subs = [];
  const load = () => ls.get(KEY, []);
  const save = a => { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch { toast("Billedet er for stort til demo"); return; } subs.forEach(f => f(a)); };
  addEventListener("storage", e => { if (e.key === KEY) subs.forEach(f => f(load())); }); // live mellem faner i demo
  return {
    subscribe(cb) { subs.push(cb); cb(load()); },
    async add(w) { const a = load(); a.push({ ...w, id: crypto.randomUUID() }); save(a); },
    async update(id, p) { save(load().map(w => w.id === id ? { ...w, ...p } : w)); },
    async remove(id) { save(load().filter(w => w.id !== id)); }
  };
}
async function firebaseStore() {
  const V = "10.12.2";
  const [{ initializeApp }, fs] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
  ]);
  const db = fs.getFirestore(initializeApp(CONFIG.firebase));
  const col = fs.collection(db, "onsker");
  return {
    subscribe(cb) {
      fs.onSnapshot(col,
        s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))),
        e => { console.error(e); toast("Kunne ikke hente ønsker (" + e.code + ")"); });
    },
    add: w => fs.addDoc(col, w),
    update: (id, p) => fs.updateDoc(fs.doc(db, "onsker", id), p),
    remove: id => fs.deleteDoc(fs.doc(db, "onsker", id))
  };
}

/* ---------- Tilstand ---------- */
const params = new URLSearchParams(location.search);
const VIEW = params.has("vis");          // delt link = kun visning
const state = {
  wishes: [], loaded: false,
  unlocked: !CONFIG.kode || ls.get("onskeliste-kode") === CONFIG.kode,
  // I redigér-tilstand styres tema/personer af del-indstillingerne, så du ser præcis det gæsterne ser
  share: ls.get("onskeliste-del", { vis: CONFIG.persons.map(p => p.id), tema: "jul", dato: nextDate(12, 24) }),
  order: (() => { const o = ls.get("onskeliste-raekkefolge", []).filter(id => person(id)); CONFIG.persons.forEach(p => { if (!o.includes(p.id)) o.push(p.id); }); return o; })(),
  tab: null
};
if (VIEW) {
  const v = params.get("vis").split(",").filter(id => person(id));
  state.vis = v.length ? v : CONFIG.persons.map(p => p.id);
  state.tema = THEMES[params.get("tema")] ? params.get("tema") : "";
  state.dato = /^\d{4}-\d{2}-\d{2}$/.test(params.get("dato") || "") ? params.get("dato") : "";
} else {
  state.vis = state.order;
  state.share.vis = state.order.filter(id => state.share.vis.includes(id));
  state.tema = state.share.tema;
  state.dato = state.share.dato;
}
state.tab = ls.get("onskeliste-fane", null);
if (!state.vis.includes(state.tab)) state.tab = state.vis[0];

const showsFor = (w, tema) => !tema || !w.occasions || !w.occasions.length || w.occasions.includes(tema);
const sorted = list => [...list].sort((a, b) => (b.fav ? 1 : 0) - (a.fav ? 1 : 0) || (a.order ?? 0) - (b.order ?? 0));
const wishesFor = id => sorted(state.wishes.filter(w => w.person === id && (!VIEW || showsFor(w, state.tema))));

/* ---------- Effekter ---------- */
let fxKey = null;
function effects() {
  const key = state.tema;
  if (key === fxKey) return; fxKey = key;
  const layer = $("#fx"); layer.innerHTML = "";
  const t = THEMES[key]; if (!t) return;
  layer.className = "fx " + t.mode;
  const n = innerWidth < 600 ? 16 : 26;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.textContent = t.fx[i % t.fx.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = 9 + Math.random() * 12 + "s";
    s.style.animationDelay = -Math.random() * 20 + "s";
    s.style.fontSize = (t.mode === "rise" ? 18 + Math.random() * 20 : 10 + Math.random() * 16) + "px";
    s.style.opacity = (t.mode === "rise" ? .55 : .35) + Math.random() * .45;
    layer.appendChild(s);
  }
}

/* ---------- Tekster ---------- */
function heroTitle() {
  const t = THEMES[state.tema];
  const vis = VIEW ? state.vis : state.share.vis;
  if (vis.length === 1) { const p = person(vis[0]); return t ? `${p.gen} ønsker ${t.til}` : `${p.gen} ønskeliste`; }
  return t ? `Vores ønsker ${t.til}` : "Vores ønskelister";
}
function shownPersons() { return VIEW ? state.vis : state.share.vis; }
function eventName() {
  const vis = shownPersons();
  switch (state.tema) {
    case "jul": return "jul";
    case "fodselsdag": return vis.length === 1 ? `${person(vis[0]).gen} fødselsdag` : "fødselsdagen";
    case "bryllup": return "brylluppet";
    case "fest": return "festen";
    default: return "";
  }
}
function countdown() {
  if (!state.dato) return "";
  const [y, m, d] = state.dato.split("-").map(Number);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((new Date(y, m - 1, d) - today) / 864e5);
  if (days < 0) return "";
  const ev = eventName();
  const icon = THEMES[state.tema]?.icon || "🎉";
  if (days === 0) {
    if (state.tema === "jul") return "I dag er det jul! 🎄";
    return ev ? `I dag er det ${ev}! ${icon}` : "Det er i dag! 🎉";
  }
  const n = days === 1 ? "1 dag" : `${days} dage`;
  return ev ? `${n} til ${ev}` : `${n} tilbage`;
}
function greeting() {
  if (!state.tema) return "";
  const solo = state.tema === "fodselsdag" ? shownPersons().length === 1 : state.tema === "jul" ? false : shownPersons().length === 1;
  return solo ? "Jeg glæder mig til at se jer" : "Vi glæder os til at se jer";
}

async function move(id, dir) {
  const list = wishesFor(state.tab).filter(w => !!w.fav === !!state.wishes.find(x => x.id === id).fav);
  const i = list.findIndex(w => w.id === id), j = i + dir;
  if (j < 0 || j >= list.length) { toast("⭐-ønsker står altid først"); return; }
  // giv alle et fast rækkefølge-nummer og byt de to
  const all = wishesFor(state.tab);
  const ord = all.map((w, k) => ({ id: w.id, order: k }));
  const a = ord.find(o => o.id === list[i].id), b = ord.find(o => o.id === list[j].id);
  [a.order, b.order] = [b.order, a.order];
  await Promise.all(ord.filter(o => (all.find(w => w.id === o.id).order ?? -1) !== o.order).map(o => store.update(o.id, { order: o.order })));
}

function fmtPrice(p) {
  p = String(p || "").trim();
  if (!p) return "";
  return /(kr\.?|dkk|,-)$/i.test(p) ? p : p + " kr.";
}
function cleanPrice(p) { return String(p || "").trim().replace(/\s*(kr\.?|dkk|,-)$/i, "").trim(); }
function findPrice(s) {
  const m = s.match(/(\d{1,3}(?:[.\s]\d{3})*(?:,\d{2})?)\s?(kr\.?|DKK)/i) || s.match(/(?:kr\.?|DKK)\s?(\d{1,3}(?:[.\s]\d{3})*(?:,\d{2})?)/i);
  return m ? m[1].replace(/\s/g, ".") : "";
}
function compress(file, max = 1000, q = 0.78) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = rej; img.src = u;
  });
}
/* Vinduer lukkes med telefonens tilbage-knap/-swipe i stedet for at lukke appen */
const overlays = [];
function openOverlay(el) {
  document.body.appendChild(el); overlays.push(el);
  history.pushState({ overlay: overlays.length }, "");
}
function closeOverlay(el) {
  if (!el || !el.isConnected) return;
  if (overlays.at(-1) === el) history.back(); else { Element.prototype.remove.call(el); overlays.splice(overlays.indexOf(el), 1); }
}
addEventListener("popstate", () => {
  const el = overlays.pop();
  if (el) { Element.prototype.remove.call(el); document.querySelectorAll(".card.picked").forEach(c => c.classList.remove("picked")); }
});
function modal(html, opts = {}) {
  const m = document.createElement("div");
  m.className = "modal"; m.innerHTML = `<div class="sheet">${html}</div>`;
  m.close = () => closeOverlay(m);
  m.remove = m.close;
  // Luk kun ved klik udenfor hvis både tryk og slip skete udenfor (og ikke i formularer)
  let downOutside = false;
  m.addEventListener("pointerdown", e => { downOutside = e.target === m; });
  m.addEventListener("click", e => {
    if (e.target.closest("[data-x]")) return m.close();
    if (opts.backdrop !== false && e.target === m && downOutside) m.close();
  });
  openOverlay(m); return m;
}
function showWish(id, cardEl) {
  const w = state.wishes.find(x => x.id === id); if (!w) return;
  if (cardEl) cardEl.classList.add("picked");
  const d = document.createElement("div");
  d.className = "detail";
  d.innerHTML = `<div class="dbox">
    ${w.image ? `<div class="dimg"><img src="${esc(w.image)}" alt=""></div>` : `<div class="dimg ph">🎁</div>`}
    <div class="dtxt">
      ${w.fav ? `<div class="dfav">⭐ Største ønske</div>` : ""}
      <h2>${esc(w.title || "Ønske")}</h2>
      ${w.price ? `<div class="dprice">${esc(fmtPrice(w.price))}</div>` : ""}
      ${w.note ? `<p>${esc(w.note)}</p>` : ""}
      <div class="dbtns">
        ${w.url ? `<a class="btn pri big" href="${esc(w.url)}" target="_blank" rel="noopener">Se varen i butikken ↗</a>` : ""}
        <button class="btn sec big" data-close>← Tilbage til ønskerne</button>
      </div>
    </div>
  </div>`;
  d.addEventListener("click", e => { if (e.target === d || e.target.closest("[data-close]")) closeOverlay(d); });
  openOverlay(d);
}

/* ---------- Start ---------- */
let store;
(async () => {
  render();
  try { store = DEMO ? demoStore() : await firebaseStore(); }
  catch (e) { console.error(e); toast("Kunne ikke forbinde til databasen"); return; }
  store.subscribe(ws => {
    state.wishes = ws; state.loaded = true;
    // Gæstevisning opdateres altid live; redigér-siden venter hvis et vindue er åbent
    if (VIEW || !document.querySelector(".modal .sheet #fs")) render();
  });
})();
</script>
